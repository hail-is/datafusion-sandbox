name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Overrides `-Ctarget-cpu=native` from .cargo/config.toml. GitHub documents no CPU baseline for
  # its runners, so a cached native build restored onto an older CPU could fail with SIGILL.
  RUSTFLAGS: ""

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # With no arguments, installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: scripts/check
