[project]
name = "hailtools"
version = "0.1.0"
description = "Utilities for creating parquet and vortex files from Hail data"
readme = "README.md"
authors = [
    { name = "patrick-schultz", email = "pschultz@broadinstitute.org" }
]
requires-python = ">=3.13"
dependencies = [
    "hail==0.2.139",
    "pyarrow>=25.0.1",
    # Held at 0.24 although 0.27 is out: typer 0.25 and later require rich>=13.8, and hail
    # 0.2.139 requires rich<13.
    "typer>=0.24.2,<0.25",
    "vortex-data==0.86.1",
    "numpy>=2.5.3,<3",
    "altair>=6.3.0",
]

[project.scripts]
hailtools = "hailtools.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
