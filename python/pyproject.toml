[project]
name = "hailtools"
version = "0.1.0"
description = "Utilities for creating parquet and vortex files from Hail data"
readme = "README.md"
authors = [
    { name = "patrick-schultz", email = "pschultz@broadinstitute.org" }
]
requires-python = ">=3.13"
dependencies = [
    "hail==0.2.138",
    "typer>=0.24.0",
    "vortex-data>=0.83.0",
    "numpy>=2,<3",
]

[project.scripts]
hailtools = "hailtools.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
