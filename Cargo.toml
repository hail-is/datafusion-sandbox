[package]
name = "datafusion-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
clap = { version = "4.6.1", features = ["derive"] }
datafusion = "55.0.0"
object_store = { version = "0.13.2", features = ["gcp"]}
vortex-datafusion = { git = "https://github.com/patrick-schultz/vortex", branch = "file-stats-type-fix" }
vortex = { git = "https://github.com/patrick-schultz/vortex", branch = "file-stats-type-fix" }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
futures = "0.3"
futures-util = "0.3"

[dev-dependencies]
divan = "0.1.21"
tempfile = "3.27.0"

[profile.release]
# debug = true

[[bench]]
name = "example"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"
