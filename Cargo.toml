[package]
name = "datafusion-sandbox"
version = "0.1.0"
edition = "2024"

[features]
# Off by default, so the system allocator stays the baseline to compare against. See the README
# for the cmake and CXXFLAGS requirements that come with it.
snmalloc = ["dep:snmalloc-rs"]

[dependencies]
async-trait = "0.1"
clap = { version = "4.6.1", features = ["derive"] }
datafusion = "55.0.0"
# The `datafusion` facade does not re-export the file statistics aggregation helper.
datafusion-datasource = "55.0.0"
object_store = { version = "0.13.2", features = ["gcp"]}
snmalloc-rs = { version = "0.7.5", optional = true }
vortex-datafusion = { git = "https://github.com/patrick-schultz/vortex", branch = "file-stats-type-fix" }
vortex = { git = "https://github.com/patrick-schultz/vortex", branch = "file-stats-type-fix" }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
futures-util = "0.3"
# `getrusage`, for the run record's peak resident set size.
libc = "0.2"
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
divan = "0.1.21"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = true      # Eliminate debug info to minimize binary size

[profile.release-nonlto]
inherits = "release"
codegen-units = 16
lto = false
strip = false        # Retain debug info for flamegraphs

[[bench]]
name = "example"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

large_futures = "warn"
dbg_macro = "warn"
mod_module_files = "warn"

# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"

# Don't Fail Silently - prevent swallowed errors
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
