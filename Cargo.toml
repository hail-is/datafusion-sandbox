[package]
name = "datafusion-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
datafusion = "55.0.0"
object_store = { version = "0.13.2", features = ["gcp"]}
vortex-datafusion = { git = "https://github.com/vortex-data/vortex", rev = "7152f4cac5845c973d16702c6af531dcccc1d423" }
vortex = { git = "https://github.com/vortex-data/vortex.git", rev = "7152f4cac5845c973d16702c6af531dcccc1d423" }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
futures = "0.3"
futures-util = "0.3"

[dev-dependencies]
divan = "0.1.21"
tempfile = "3.27.0"

[profile.release]
# debug = true

[[bench]]
name = "example"
harness = false
