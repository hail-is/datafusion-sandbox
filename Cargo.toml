[package]
name = "datafusion-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
datafusion = "54.1.0"
object_store = { version = "0.13.2", features = ["gcp"]}
vortex-datafusion = "0.78.0"
vortex = { version = "0.78.0", features = ["object_store", "tokio", "files", "zstd"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
futures = "0.3"
futures-util = "0.3"

[dev-dependencies]
divan = "0.1.21"

[profile.release]
debug = true

[[bench]]
name = "example"
harness = false
