[package]
name = "datafusion-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
datafusion = "54.1.0"
vortex-datafusion = "0.78.0"
vortex = { version = "0.78.0", features = ["object_store", "tokio", "files", "zstd"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
futures = "0.3"
futures-util = "0.3"

[dev-dependencies]
divan = "0.1.21"

[profile.release]
debug = true

[[bench]]
name = "example"
harness = false
